services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pr-db:5432/${POSTGRES_DB}
      PORT: 3000
      MATTERMOST_URL: ${MATTERMOST_URL}
      MATTERMOST_LOGIN_ID: ${MATTERMOST_LOGIN_ID}
      MATTERMOST_PASSWORD: ${MATTERMOST_PASSWORD}
      MATTERMOST_TOKEN: ${MATTERMOST_TOKEN}
      MATTERMOST_TEAM_ID: ${MATTERMOST_TEAM_ID}
      MATTERMOST_BOARD_ID: ${MATTERMOST_BOARD_ID}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      ADMIN_LOGINS: ${ADMIN_LOGINS}
    depends_on:
      pr-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  pr-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - pr-monitor-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pr-monitor-db-data:
